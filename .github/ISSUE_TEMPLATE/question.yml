name: ❓ Question / Soru
description: Ask how to use a tool or how to model a circuit. / Bir aracın kullanımı veya devre modelleme hakkında soru sorun.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question / Soru
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / Bağlam
      description: Circuit, frequency, Touchstone snippet or the tool call you tried.
